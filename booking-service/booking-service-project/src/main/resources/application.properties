spring.application.name=booking-service-project
server.port=3004

spring.data.redis.host=${REDIS_HOST:booking-cache}

# Flyway owns the schema: Hibernate only checks that the entities match it, and the app fails to start if not
spring.jpa.hibernate.ddl-auto=validate
# No database access while the response is being written: everything a response needs is loaded in the service
spring.jpa.open-in-view=false

# Kafka producer. Bootstrap servers come from .env (SPRING_KAFKA_BOOTSTRAP_SERVERS)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# A send waits at most about 5 s, so a Kafka outage fails the request quickly instead of hanging it
# max.block.ms: waiting for Kafka to be reachable. delivery.timeout.ms: waiting for Kafka to store the event
# (must be at least linger.ms + request.timeout.ms)
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=4000

# Calls to the payment-service. One automatic retry when it does not answer in time or fails (same bookingId, so never
# charged twice), and a circuit breaker that stops calling it for 30 s when at least half of the last 10 calls failed.
# Only PaymentUnavailableException counts: a refusal (e.g. a declined card) is a normal answer, and an open circuit is not retried
resilience4j.retry.instances.payment.max-attempts=2
resilience4j.retry.instances.payment.wait-duration=500ms
resilience4j.retry.instances.payment.retry-exceptions=com.example.bookingserviceproject.exception.PaymentUnavailableException
resilience4j.circuitbreaker.instances.payment.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.payment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.payment.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment.record-exceptions=com.example.bookingserviceproject.exception.PaymentUnavailableException

