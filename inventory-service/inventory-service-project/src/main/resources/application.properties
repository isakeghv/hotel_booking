spring.application.name=inventory-service-project
server.port=3002
image.base.url=http://localhost:8080/images/
hotel.checkin.time=15:00
hotel.checkout.time=12:00
spring.data.redis.host=${REDIS_HOST:inventory-reserved-cache}
spring.data.redis.port=${REDIS_PORT:6379}
# Swagger: under /inventory so it is reachable through the gateway, e.g. http://localhost:8080/inventory/swagger-ui.html
springdoc.api-docs.path=/inventory/v3/api-docs
springdoc.swagger-ui.path=/inventory/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Keeps Springwolf's own endpoints out of the Swagger documentation
springdoc.paths-to-exclude=/inventory/springwolf/**
# Springwolf (Kafka documentation): under /inventory so it is reachable through the gateway,
# e.g. http://localhost:8080/inventory/springwolf/asyncapi-ui.html. The UI itself is served by SpringwolfConfig
springwolf.path.base=/inventory/springwolf
springwolf.docket.base-package=com.example.inventoryserviceproject.service
springwolf.docket.info.title=Inventory service events
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=Kafka events the inventory-service consumes from the booking-service. \
  All messages are JSON, sent as text. The inventory-service does not publish any events.
springwolf.docket.servers.kafka-server.protocol=kafka
springwolf.docket.servers.kafka-server.host=${spring.kafka.bootstrap-servers:localhost:9092}
# The listeners take a raw String, so the automatic scan would document every payload as "string".
# Each listener is documented with @AsyncListener instead
springwolf.plugin.kafka.scanner.kafka-listener.enabled=false
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
